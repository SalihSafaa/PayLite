# Serves the built SPA and reverse-proxies the APIs, so the browser sees a single origin
# (no CORS). Keep this routing table identical to the dev proxy in vite.config.ts.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Activity Service (Owner B)
    location /api/notifications { proxy_pass http://activity-service:8080; include /etc/nginx/proxy_common.conf; }
    location /api/merchants/me/daily-summary { proxy_pass http://activity-service:8080; include /etc/nginx/proxy_common.conf; }
    location /hubs/ {
        proxy_pass http://activity-service:8080;
        include /etc/nginx/proxy_common.conf;
        # SignalR uses WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Everything else under /api is the Wallet API (Owner A)
    location /api/ { proxy_pass http://wallet-api:8080; include /etc/nginx/proxy_common.conf; }

    # Client-side routing: unknown paths return index.html
    location / { try_files $uri /index.html; }
}
